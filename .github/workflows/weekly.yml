name: Weekly league report

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leagueuser
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: leaguedb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://leagueuser:changeme@localhost:5432/leaguedb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest
      - run: python src/seed.py
      - run: python src/assign_teams.py
      - run: python src/reminders.py
      - run: python src/report.py
      - uses: actions/upload-artifact@v4
        with:
          name: league-report
          path: |
            report.html
            outbox/